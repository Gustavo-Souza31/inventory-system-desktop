name: Supabase Keep-Alive

on:
  schedule:
    # Roda a cada 5 dias às 03:00 UTC (evita o pause de 7 dias por inatividade)
    - cron: '0 3 */5 * *'
  workflow_dispatch: # permite rodar manualmente pelo GitHub também, pra testar

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A lógica fica no script para poder ser testada fora do GitHub.
      # Ele limpa espaços/aspas dos segredos e explica o erro quando algo está errado.
      - name: Ping Supabase project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash .github/scripts/ping-supabase.sh
